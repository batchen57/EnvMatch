server.port=8888

spring.application.name=envmatch-backend
spring.datasource.url=jdbc:sqlite:envmatch.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=4096MB

envmatch.storage-dir=storage
envmatch.ai.max-inline-media-bytes=16777216
envmatch.task-executor.core-size=2
envmatch.task-executor.max-size=4
envmatch.task-executor.queue-capacity=50
