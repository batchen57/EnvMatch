server.port=8888

spring.application.name=envmatch-backend
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:envmatch}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

mybatis-plus.global-config.db-config.id-type=input
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=4096MB

envmatch.storage-dir=storage
envmatch.ai.max-inline-media-bytes=16777216
envmatch.task-executor.core-size=2
envmatch.task-executor.max-size=4
envmatch.task-executor.queue-capacity=50
